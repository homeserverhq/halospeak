services:
  halospeak:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROCM_PYTORCH_BASE: "${ROCM_PYTORCH_BASE:-rocm/pytorch:rocm7.0_ubuntu22.04_py3.10_pytorch_release_2.8.0}"
        HSA_OVERRIDE_GFX_VERSION: "${HSA_OVERRIDE_GFX_VERSION:-}"

    image: hshq/halospeak-gpu:3.0.0
    container_name: halospeak
    restart: unless-stopped

    # To allow AMD GPU access:
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    group_add:
      - video
    ipc: host
    shm_size: 8G

    env_file:
      # - .env
      - "$HOME/.config/halospeak/.env"

    environment:
      WHISPER_DEVICE: "0"
      WHISPER_DTYPE: "float16"
      DIARIZATION_DEVICE: "cuda"
      DIARIZATION_PRELOAD_AUDIO: "true"
      DIARIZATION_ALLOW_CPU_FALLBACK: "true"
      DIARIZATION_DISABLE_MIOPEN: "true"
      DIARIZATION_EMBEDDING_CLUSTERING: "true"
      WHISPER_DIARIZATION_MODEL: "pyannote/speaker-diarization-community-1"
      MIOPEN_FIND_MODE: "2"
      DEMUCS_DEFAULT: "false"

    ports:
      - "${API_PORT:-8888}:${API_PORT:-8888}"  # API port
      - "${WEBUI_PORT:-7860}:${WEBUI_PORT:-7860}"  # WebUI port

    volumes:
      - "./transcripts:/app/transcripts"
      - "./transcripts-txt:/app/transcripts-txt"
      - "./transcripts-srt:/app/transcripts-srt"
      - "./temp_uploads:/app/temp_uploads"
      - "$HOME/.cache/huggingface/hub:/root/.cache/huggingface/hub"

    #################################################
    ## Default: Gradio WebUI without debug logging ##
    #################################################
    command: ["python", "-m", "halospeak.webui"]
    ##############################################
    ## Alternative commands (uncomment to use): ##
    ##############################################
    #
    # Gradio WebUI with debug logging:
    # command: ["python", "-m", "halospeak.webui", "--debug"]
    #
    # API only:
    # command: ["python", "-m", "halospeak"]
    #
    # API with verbose output:
    # command: ["python", "-m", "halospeak", "-v"]
    #
    # Custom WebUI with extra args:
    # command: ["python", "-m", "halospeak.webui", "--port", "7860", "--host", "0.0.0.0", "--debug"]
    #
    # CLI tool transcription example:
    # command: ["python", "-m", "halospeak.cli", "transcribe", "tests/data/conversion-test-file.mp3", "--debug"]
